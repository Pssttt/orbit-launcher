name: Android CI

on:
  push:
    branches: [ main, migration/cleanyourtv ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Test, lint and build TV Home
        run: ./gradlew :tvhome:testReleaseUnitTest :tvhome:lintRelease :tvhome:assembleRelease --no-daemon --stacktrace

      - name: Upload TV Home APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-release-apk
          path: tvhome/build/outputs/apk/release/tvhome-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
